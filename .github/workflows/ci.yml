name: CI

# Gates every PR and re-validates main after merge. Production deployment is
# owned by the Vercel GitHub integration, not this workflow.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Add lint / test steps here once those scripts exist in package.json.
      - run: npm run build
